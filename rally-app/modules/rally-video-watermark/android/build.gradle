apply plugin: 'com.android.library'

group = 'expo.modules.rallyvideowatermark'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// Resolve SDK levels from the host app's gradle ext so this module tracks Rally's
// compile/target/min SDK (35 / 35 / 26) without a hard-coded fork point.
def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "expo.modules.rallyvideowatermark"
  compileSdkVersion safeExtGet('compileSdkVersion', 35)

  defaultConfig {
    // Media3 requires minSdk 21; Rally is already on 26.
    minSdkVersion safeExtGet('minSdkVersion', 26)
    targetSdkVersion safeExtGet('targetSdkVersion', 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  // Media3 Transformer stack — first-party AndroidX frame compositor (no ffmpeg).
  // 1.4.1 is the current stable line; bump in lockstep across all three artifacts.
  def media3Version = "1.4.1"
  implementation "androidx.media3:media3-transformer:$media3Version"
  implementation "androidx.media3:media3-effect:$media3Version"
  implementation "androidx.media3:media3-common:$media3Version"
}
